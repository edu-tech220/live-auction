# Full demo environment: SQL Server + API + frontend.
#   cp .env.example .env   (then change the values)
#   docker compose up --build
# Frontend: http://localhost:8080   API/Swagger: http://localhost:5080/swagger

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/LiveAuction.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=LiveAuction;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Database__MigrateOnStartup: "true"
      Database__Seed__Enabled: "true"
      Database__Seed__AdminEmail: ${ADMIN_EMAIL:-admin@liveauction.local}
      Database__Seed__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      Database__Seed__DemoPassword: ${DEMO_PASSWORD:-}
      Cors__AllowedOrigins__0: "http://localhost:8080"
      Swagger__Enabled: "true"
    # Health: GET http://localhost:5080/health (the runtime image has no curl/wget,
    # so it is checked from outside the container).
    ports:
      - "5080:8080"

  # React frontend (separate repository): Compose builds it straight from GitHub.
  frontend:
    build:
      context: https://github.com/edu-tech220/live-auction-web.git#main
      args:
        VITE_API_URL: http://localhost:5080
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sqldata:
