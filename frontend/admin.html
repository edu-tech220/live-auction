<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Administrar · Live Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="container" style="padding:32px 0 56px;display:grid;gap:24px">
    <section class="panel">
      <h2 style="margin-top:0">Nueva subasta</h2>
      <div id="message"></div>
      <form id="form">
        <div class="field"><label for="title">Título</label><input class="input" id="title" required minlength="3" maxlength="120" /></div>
        <div class="field"><label for="description">Descripción</label><textarea class="input" id="description" rows="3" maxlength="2000"></textarea></div>
        <div class="field"><label for="imageUrl">URL de imagen (opcional)</label><input class="input" id="imageUrl" type="url" maxlength="500" /></div>
        <div class="form-grid">
          <div class="field"><label for="startingPrice">Precio inicial</label><input class="input" id="startingPrice" type="number" min="0.01" step="0.01" required /></div>
          <div class="field"><label for="minIncrement">Incremento mínimo</label><input class="input" id="minIncrement" type="number" min="0.01" step="0.01" required /></div>
          <div class="field"><label for="startsAt">Inicio</label><input class="input" id="startsAt" type="datetime-local" required /></div>
          <div class="field"><label for="endsAt">Fin</label><input class="input" id="endsAt" type="datetime-local" required /></div>
        </div>
        <button class="btn btn-gold" type="submit">Crear subasta</button>
      </form>
    </section>

    <section class="panel">
      <h2 style="margin-top:0">Subastas</h2>
      <div style="overflow:auto"><table class="admin" id="table"></table></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
