<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar · Live Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="auth-wrap">
    <div class="panel auth-card">
      <div class="tabs" style="margin-bottom:20px">
        <button class="active" data-mode="login">Iniciar sesión</button>
        <button data-mode="register">Crear cuenta</button>
      </div>

      <div id="message"></div>

      <form id="form" novalidate>
        <div class="field" id="name-field" hidden>
          <label for="displayName">Nombre visible</label>
          <input class="input" id="displayName" autocomplete="nickname" maxlength="60" />
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input class="input" id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required />
          <span class="muted small" id="password-hint" hidden>Mínimo 8 caracteres, con al menos una letra y un número.</span>
        </div>
        <button class="btn btn-gold btn-block" id="submit" type="submit">Entrar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
