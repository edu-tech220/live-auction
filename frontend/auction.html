<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subasta · Live Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="container">
    <div class="auction-layout" id="layout">
      <section>
        <a href="index.html" class="muted small">← Todas las subastas</a>
        <div class="media-large" style="margin-top:12px"><img id="image" alt="" /></div>
        <div class="panel" style="margin-top:20px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <span id="status"></span>
            <span class="muted small" id="viewers"></span>
          </div>
          <h1 class="title-xl" id="title" style="margin-top:10px">Cargando…</h1>
          <p class="muted" id="description"></p>
          <p class="muted small" id="seller"></p>
        </div>
      </section>

      <aside style="display:grid;gap:20px;align-content:start">
        <div id="result" hidden></div>

        <div class="panel">
          <div class="price-label" id="price-label">Oferta actual</div>
          <div class="price-xl" id="price">—</div>
          <div class="stats">
            <div class="stat"><span class="muted small" id="countdown-label">Termina en</span><b class="countdown" id="countdown">—</b></div>
            <div class="stat"><span class="muted small">Ofertas</span><b id="bid-count">0</b></div>
            <div class="stat"><span class="muted small">Incremento</span><b id="increment">—</b></div>
          </div>
          <div class="leader" id="leader" hidden></div>

          <div id="bid-area" style="margin-top:16px"></div>
        </div>

        <div class="panel">
          <h3 style="margin:0 0 12px">Historial de ofertas</h3>
          <ul class="history" id="history"></ul>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
  <script type="module" src="js/pages/auction.js"></script>
</body>
</html>
