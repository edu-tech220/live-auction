<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Auction · Subastas en tiempo real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar"></header>

  <main class="container">
    <section class="hero">
      <h1>Puja en <span class="accent">tiempo real</span>.</h1>
      <p>Los precios se actualizan al instante para todos. El servidor valida cada oferta y decide cuándo termina cada subasta.</p>
    </section>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="active" data-status="Active">En vivo</button>
        <button data-status="Scheduled">Próximas</button>
        <button data-status="Finished">Finalizadas</button>
        <button data-status="">Todas</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Buscar por título…" aria-label="Buscar" />
    </div>

    <section class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.11/dist/browser/signalr.min.js"></script>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
